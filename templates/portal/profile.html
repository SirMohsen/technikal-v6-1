{% extends "portal/base.html" %}{% block content %}<main class="auth-wrap"><section class="auth-card wide"><span class="eyebrow">شناخت شرایط تو</span><h1>پروفایل مطالعاتی</h1><p class="muted">این اطلاعات برای برنامه‌ریزی شخصی در نسخه‌های بعدی استفاده می‌شود.</p><form method="post" class="form-stack">{% csrf_token %}<label>دقایق مطالعه روزانه<input type="number" name="daily_minutes" min="15" max="720" value="{{ profile.daily_minutes }}"></label><label>وضعیت کاری<select name="work_schedule"><option value="">انتخاب کن</option><option value="full_time">شاغل تمام‌وقت</option><option value="part_time">پاره‌وقت</option><option value="flexible">زمان منعطف</option></select></label><label>سطح تجربه<select name="experience_level"><option value="">انتخاب کن</option><option value="beginner">شروع از ابتدا</option><option value="intermediate">آشنایی متوسط</option><option value="advanced">آمادگی بالا</option></select></label><label>زمان ترجیحی مطالعه<select name="preferred_study_time"><option value="">انتخاب کن</option><option value="morning">صبح</option><option value="afternoon">بعدازظهر</option><option value="night">شب</option></select></label><label>تاریخ تقریبی آزمون<input type="date" name="exam_date" value="{{ profile.exam_date|date:'Y-m-d' }}"></label><button class="btn primary block">ذخیره اطلاعات</button></form></section></main>{% endblock %}
